<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>miDNI</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: #000; height: 100vh; display: flex; justify-content: center; overflow: hidden; }
        .phone { width: 100%; max-width: 414px; height: 100vh; background: #fff; position: relative; }
        .screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; background-size: 100% 100%; background-position: center; background-repeat: no-repeat; }
        .active { display: block !important; }

        /* Pantalla 1: Formulario */
        #sc-setup { display: block; background: #f2f2f7; padding: 40px 20px; z-index: 1000; }
        .card { background: #fff; padding: 20px; border-radius: 15px; }
        input { width: 100%; padding: 14px; margin-bottom: 12px; border: 1px solid #d1d1d6; border-radius: 10px; font-size: 16px; }
        .btn-acc { background: #1a2b4e; color: #fff; width: 100%; padding: 18px; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; }

        /* Imágenes Locales */
        #sc-loading { background-image: url('IMG_2080.jpeg'); background-color: #fff; }
        #sc-options { background-image: url('IMG_2082.jpeg'); }
        #sc-dni { background-image: url('IMG_2093.jpeg'); }

        .btn-inv { position: absolute; width: 85%; left: 7.5%; height: 12%; background: transparent; border: none; }
        .u-txt { position: absolute; color: #1a2b4e; font-weight: 500; font-size: 21px; pointer-events: none; text-transform: uppercase; }
        #r-dni { top: 57.5%; left: 8.5%; }
        #r-ape { top: 64.8%; left: 8.5%; }
        #r-nom { top: 72.2%; left: 8.5%; }
    </style>
</head>
<body>
<div class="phone">
    <div id="sc-setup" class="screen active">
        <div class="card">
            <input type="text" id="i-nom" placeholder="NOMBRE">
            <input type="text" id="i-ape" placeholder="APELLIDOS">
            <input type="text" id="i-dni" placeholder="DNI">
            <button class="btn-acc" onclick="procesar()">ACCEDER</button>
        </div>
    </div>
    <div id="sc-loading" class="screen"></div>
    <div id="sc-options" class="screen">
        <button class="btn-inv" style="top:54%" onclick="irFin()"></button>
    </div>
    <div id="sc-dni" class="screen">
        <div class="u-txt" id="r-dni"></div>
        <div class="u-txt" id="r-ape"></div>
        <div class="u-txt" id="r-nom"></div>
    </div>
</div>

<script>
    function nav(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    }

    function procesar() {
        // Primero cambiamos de pantalla, luego leemos datos
        nav('sc-loading');
        document.getElementById('r-nom').innerText = document.getElementById('i-nom').value;
        document.getElementById('r-ape').innerText = document.getElementById('i-ape').value;
        document.getElementById('r-dni').innerText = document.getElementById('i-dni').value;
        setTimeout(() => { nav('sc-options'); }, 1500);
    }

    function irFin() {
        nav('sc-loading');
        setTimeout(() => { nav('sc-dni'); }, 800);
    }
</script>
</body>
</html>
