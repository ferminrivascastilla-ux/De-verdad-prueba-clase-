<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>miDNI Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: #000; height: 100vh; display: flex; justify-content: center; }
        .phone { width: 100%; max-width: 414px; height: 100vh; background: #fff; position: relative; overflow: hidden; }

        /* Pantallas */
        .screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; background-size: 100% 100%; background-position: center; }
        .active { display: block; }

        /* Pantalla 1: Formulario */
        #sc-setup { display: block; background: #f2f2f7; padding: 60px 20px; z-index: 1000; }
        .card { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin: 10px 0 20px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
        .btn-entrar { background: #1a2b4e; color: #fff; width: 100%; padding: 18px; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; }

        /* Pantalla 2: Carga (Tu nueva foto) */
        #sc-loading { background-image: url('https://files.oaiusercontent.com/file-ea79148d-d82b-48df-bfc8-e536f32225b2'); background-color: #fff; }

        /* Pantalla 3: Opciones */
        #sc-options { background-image: url('https://files.oaiusercontent.com/file-bb60ff67-0c47-4cdb-9c40-bee6ed97102d'); }
        .tap-opt { position: absolute; width: 90%; left: 5%; height: 11%; background: rgba(255,0,0,0); cursor: pointer; border: none; }

        /* Pantalla 4: DNI Final */
        #sc-dni { background-image: url('https://files.oaiusercontent.com/file-0ca121b2-7247-40d3-84c7-8d0c9a8ef62e'); }
        .user-img { position: absolute; top: 15.3%; left: 8.5%; width: 27%; height: 18.5%; border-radius: 2px; overflow: hidden; }
        .user-img img { width: 100%; height: 100%; object-fit: cover; }
        .data { position: absolute; color: #1a2b4e; font-weight: 700; font-size: 18px; pointer-events: none; }
    </style>
</head>
<body>

<div class="phone">
    <div id="sc-setup" class="screen active">
        <div class="card">
            <h2 style="margin-bottom:15px">miDNI Setup</h2>
            <label>Foto:</label><input type="file" id="i-foto" accept="image/*">
            <label>Nombre:</label><input type="text" id="i-nom" placeholder="CARMEN">
            <label>Apellidos:</label><input type="text" id="i-ape" placeholder="ESPAÑOLA">
            <label>DNI:</label><input type="text" id="i-dni" placeholder="99949991H">
            <button class="btn-entrar" id="btn-trigger">ENTRAR</button>
        </div>
    </div>

    <div id="sc-loading" class="screen"></div>

    <div id="sc-options" class="screen">
        <button class="tap-opt" style="top:38%" onclick="verDNI()"></button>
        <button class="tap-opt" style="top:51%" onclick="verDNI()"></button>
        <button class="tap-opt" style="top:64%" onclick="verDNI()"></button>
    </div>

    <div id="sc-dni" class="screen">
        <div class="user-img"><img id="res-foto"></div>
        <div class="data" style="top:43.8%; left:11%" id="res-dni"></div>
        <div class="data" style="top:51.1%; left:11%" id="res-ape"></div>
        <div class="data" style="top:58.5%; left:11%" id="res-nom"></div>
        <div class="data" style="top:65.8%; left:11%">03 / 09 / 2001</div>
    </div>
</div>

<script>
    const btn = document.getElementById('btn-trigger');
    
    function show(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        const target = document.getElementById(id);
        target.style.display = 'block';
    }

    btn.addEventListener('click', function() {
        const file = document.getElementById('i-foto').files[0];
        if(!file) return alert("Sube tu foto primero");

        // Guardar textos
        document.getElementById('res-nom').innerText = document.getElementById('i-nom').value.toUpperCase();
        document.getElementById('res-ape').innerText = document.getElementById('i-ape').value.toUpperCase();
        document.getElementById('res-dni').innerText = document.getElementById('i-dni').value.toUpperCase();

        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('res-foto').src = e.target.result;
            
            // DINÁMICA DE CARGA: 1.5 segundos exactos
            show('sc-loading');
            setTimeout(() => {
                show('sc-options');
            }, 1500);
        };
        reader.readAsDataURL(file);
    });

    function verDNI() {
        show('sc-loading');
        setTimeout(() => {
            show('sc-dni');
        }, 800);
    }
</script>
</body>
</html>
