<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>miDNI Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: #000; height: 100vh; display: flex; justify-content: center; overflow: hidden; }
        .phone { width: 100%; max-width: 414px; height: 100vh; background: #fff; position: relative; }

        /* Pantallas */
        .screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; background-size: 100% 100%; background-position: center; background-repeat: no-repeat; }
        .active { display: block; }

        /* 1. FORMULARIO */
        #sc-setup { display: block; background: #f2f2f7; padding: 60px 20px; z-index: 1000; overflow-y: auto; }
        .card { background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
        h2 { margin-bottom: 20px; color: #1a2b4e; text-align: center; }
        label { display: block; font-size: 12px; font-weight: bold; color: #8e8e93; margin-bottom: 5px; text-transform: uppercase; }
        input { width: 100%; padding: 14px; margin-bottom: 15px; border: 1px solid #d1d1d6; border-radius: 10px; font-size: 16px; }
        .btn-entrar { background: #1a2b4e; color: #fff; width: 100%; padding: 20px; border: none; border-radius: 14px; font-weight: bold; font-size: 18px; cursor: pointer; }

        /* 2. CARGA (Imagen de Policía Nacional) */
        #sc-loading { background-image: url('https://files.oaiusercontent.com/file-ea79148d-d82b-48df-bfc8-e536f32225b2'); background-color: #fff; }

        /* 3. OPCIONES (Imagen con los 3 bloques azules) */
        #sc-options { background-image: url('https://files.oaiusercontent.com/file-9ddf0b2d-8e95-4122-9c69-9a21836a8aef'); }
        
        /* BOTONES INVISIBLES SOBRE LOS BLOQUES AZULES */
        .btn-invisible { position: absolute; width: 85%; left: 7.5%; height: 14%; background: rgba(255,0,0,0); border: none; cursor: pointer; }
        .opt-1 { top: 54%; }
        .opt-2 { top: 68.5%; }
        .opt-3 { top: 83%; }

        /* 4. DNI FINAL (Imagen de Carmen) */
        #sc-dni { background-image: url('https://files.oaiusercontent.com/file-0ca121b2-7247-40d3-84c7-8d0c9a8ef62e'); }
        
        /* Superposición de tus datos sobre Carmen */
        .user-photo { position: absolute; top: 15.3%; left: 8.5%; width: 27%; height: 18.5%; background: #fff; overflow: hidden; border-radius: 2px; }
        .user-photo img { width: 100%; height: 100%; object-fit: cover; }
        .user-data { position: absolute; color: #1a2b4e; font-weight: 700; font-size: 17px; pointer-events: none; text-transform: uppercase; }
        
        /* Coordenadas ajustadas */
        #out-dni { top: 43.8%; left: 11%; }
        #out-ape { top: 51.1%; left: 11%; }
        #out-nom { top: 58.5%; left: 11%; }
        #out-nac { top: 65.8%; left: 11%; }
    </style>
</head>
<body>

<div class="phone">
    <div id="sc-setup" class="screen active">
        <div class="card">
            <h2>miDNI Setup</h2>
            <label>Sube tu foto</label>
            <input type="file" id="in-foto" accept="image/*">
            <label>Nombre</label>
            <input type="text" id="in-nom" placeholder="NOMBRE">
            <label>Apellidos</label>
            <input type="text" id="in-ape" placeholder="APELLIDOS">
            <label>Número DNI</label>
            <input type="text" id="in-dni" placeholder="00000000X">
            <label>Fecha Nacimiento</label>
            <input type="text" id="in-nac" value="01 / 01 / 2000">
            <button class="btn-entrar" id="btn-trigger">CONFIGURAR Y ENTRAR</button>
        </div>
    </div>

    <div id="sc-loading" class="screen"></div>

    <div id="sc-options" class="screen">
        <button class="btn-invisible opt-1" onclick="irAlDNI()"></button>
        <button class="btn-invisible opt-2" onclick="irAlDNI()"></button>
        <button class="btn-invisible opt-3" onclick="irAlDNI()"></button>
    </div>

    <div id="sc-dni" class="screen">
        <div class="user-photo"><img id="res-foto"></div>
        <div class="user-data" id="out-dni"></div>
        <div class="user-data" id="out-ape"></div>
        <div class="user-data" id="out-nom"></div>
        <div class="user-data" id="out-nac"></div>
    </div>
</div>

<script>
    const btnEntrar = document.getElementById('btn-trigger');

    function cambiar(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById(id).style.display = 'block';
    }

    btnEntrar.addEventListener('click', function() {
        const fotoFile = document.getElementById('in-foto').files[0];
        if(!fotoFile) return alert("Sube una foto primero");

        // Asignar datos a las capas del DNI
        document.getElementById('out-nom').innerText = document.getElementById('in-nom').value;
        document.getElementById('out-ape').innerText = document.getElementById('in-ape').value;
        document.getElementById('out-dni').innerText = document.getElementById('in-dni').value;
        document.getElementById('out-nac').innerText = document.getElementById('in-nac').value;

        const lector = new FileReader();
        lector.onload = function(e) {
            document.getElementById('res-foto').src = e.target.result;
            
            // 1. Mostrar pantalla de carga (la de Policía Nacional)
            cambiar('sc-loading');

            // 2. A los 1.5 segundos, mostrar las 3 opciones azules
            setTimeout(() => {
                cambiar('sc-options');
            }, 1500);
        };
        lector.readAsDataURL(fotoFile);
    });

    function irAlDNI() {
        // Transición rápida de carga antes del DNI
        cambiar('sc-loading');
        setTimeout(() => {
            cambiar('sc-dni');
        }, 800);
    }
</script>

</body>
</html>
