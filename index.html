<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>miDNI Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, sans-serif; }
        body { background: #000; height: 100vh; display: flex; justify-content: center; overflow: hidden; }
        .phone { width: 100%; max-width: 414px; height: 100vh; background: #fff; position: relative; }
        
        .screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; background-size: 100% 100%; background-position: center; }
        .active { display: block !important; }

        /* Pantalla 1: Formulario */
        #sc-setup { display: block; background: #f2f2f7; padding: 40px 20px; z-index: 100; }
        .card { background: #fff; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 16px; }
        .btn-acc { background: #1a2b4e; color: #fff; width: 100%; padding: 18px; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; }

        /* Pantalla 2: Opciones (IMG_2082) */
        #sc-options { background-image: url('IMG_2082.jpeg'); }
        /* Hitbox tercio superior */
        .top-trigger { position: absolute; top: 0; left: 0; width: 100%; height: 35%; background: transparent; cursor: pointer; }

        /* Pantalla 3: DNI Final (IMG_2093) */
        #sc-dni { background-image: url('IMG_2093.jpeg'); }
        
        /* Foto de usuario */
        .u-foto { position: absolute; top: 21.3%; left: 8.5%; width: 33.5%; height: 23%; overflow: hidden; }
        .u-foto img { width: 100%; height: 100%; object-fit: cover; }
        
        /* Textos sobre el DNI */
        .u-txt { 
            position: absolute; 
            color: #1a2b4e; 
            font-weight: 500; 
            font-size: 21px; 
            text-transform: uppercase; 
            letter-spacing: 0.3px;
            pointer-events: none;
        }
        #r-dni { top: 57.5%; left: 8.5%; }
        #r-ape { top: 64.8%; left: 8.5%; }
        #r-nom { top: 72.2%; left: 8.5%; }
        #r-nac { top: 79.5%; left: 8.5%; }
    </style>
</head>
<body>

<div class="phone">
    <div id="sc-setup" class="screen active">
        <div class="card">
            <input type="file" id="i-foto" accept="image/*">
            <input type="text" id="i-nom" placeholder="NOMBRE">
            <input type="text" id="i-ape" placeholder="APELLIDOS">
            <input type="text" id="i-dni" placeholder="DNI">
            <input type="text" id="i-nac" value="03 / 09 / 2001">
            <button class="btn-acc" onclick="irOpciones()">ACCEDER</button>
        </div>
    </div>

    <div id="sc-options" class="screen">
        <div class="top-trigger" onclick="irDNI()"></div>
    </div>

    <div id="sc-dni" class="screen">
        <div class="u-foto"><img id="r-foto"></div>
        <div class="u-txt" id="r-dni"></div>
        <div class="u-txt" id="r-ape"></div>
        <div class="u-txt" id="r-nom"></div>
        <div class="u-txt" id="r-nac"></div>
    </div>
</div>

<script>
    function nav(id) {
        document.querySelectorAll('.screen').forEach(s => s.style.display = 'none');
        document.getElementById(id).classList.add('active');
    }

    function irOpciones() {
        // Guardar textos
        document.getElementById('r-nom').innerText = document.getElementById('i-nom').value;
        document.getElementById('r-ape').innerText = document.getElementById('i-ape').value;
        document.getElementById('r-dni').innerText = document.getElementById('i-dni').value;
        document.getElementById('r-nac').innerText = document.getElementById('i-nac').value;

        // Cargar foto
        const file = document.getElementById('i-foto').files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = e => { document.getElementById('r-foto').src = e.target.result; };
            reader.readAsDataURL(file);
        }

        nav('sc-options');
    }

    function irDNI() {
        nav('sc-dni');
    }
</script>

</body>
</html>
